name: Java CI

on:
  push:
    branches:
      - main
      - test
      - 'feature/**'
  pull_request:
    branches:
      - main
      - test

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: inventory_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Give permission to Maven Wrapper
        run: chmod +x mvnw

      - name: Run tests
        env:
          DB_USERNAME: root
          DB_PASSWORD: root
        run: ./mvnw test
